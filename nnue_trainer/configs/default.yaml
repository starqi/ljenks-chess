# Worker values: "half", "full", or int

# Common
batch_size: 100 # Pick a batch_size such that the total optimizer steps is enough
lr: 0.001
checkpoint_path: main.checkpoint
loader_num_workers: "full" 


# train_once.py
positions_path: xyz.bin
simple_epochs: 100


# repeat_train.py
cycles: 100
epochs_per_cycle: 3
games_per_worker: 50 # 11,000
games_per_worker_validation_set: 25
workers: "full"

# TODO IMMEDIATE Update this when it becomes more clear what is going on
# INTUITION: Need shallow depth, never train with mega high depth.
# NN cannot capture e.g. depth 20 "superintelligence" but it can capture
# risk like bishops and queens lined up against the king.

max_nodes: 30000
random_half_moves: 15
max_half_moves: 200
val_every: 1
validation_path: validation.bin
checkpoint_backup_count: 2
sigmoid_scale: 400
