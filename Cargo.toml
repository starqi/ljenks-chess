[package]
name = "ljenks-chess"
version = "0.0.1"
authors = ["starqi <helloimzirui@gmail.com>"]
edition = "2021"

# Only build as library when using WASM
[lib]
crate-type = ["cdylib"]
required-features = ["wasm"]

[features]
my_debug = [] # Project verbosity toggle
default = ["wasm"] # Language server will read this 
# TODO IMMEDIATE Test changing this
# Or never change and recommend cargo build --no-default-features -F cli                               
# Mutually exclusive features - only one should be enabled at a time
wasm = ["wasm-bindgen", "console_error_panic_hook", "wee_alloc", "my_debug"] # Use JS random
cli = ["dep:rand", "getrandom"]

# CLI binary - only built when cli feature is enabled
[[bin]]
name = "chess-cli"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
wasm-bindgen = { version = "0.2.92", optional = true }
lazy_static = "1.5.0"
rand = { version = "0.8.5", optional = true }
getrandom = { version = "0.2", optional = true }
# TODO IMMEDIATE Do we need getrandom
# TODO IMMEDIATE Why slow NPS again?

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

# `wee_alloc` is a tiny allocator for wasm that is only ~1K in code size
# compared to the default allocator's ~10K. It is slower than the default
# allocator, however.
#
# Unfortunately, `wee_alloc` requires nightly Rust when targeting wasm for now.
wee_alloc = { version = "0.4.5", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.42"
rand = "0.8.5"

[profile.release]
opt-level = 3

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.dev]
debug = true
debug-assertions = true
overflow-checks = true
panic = 'unwind'
incremental = true
